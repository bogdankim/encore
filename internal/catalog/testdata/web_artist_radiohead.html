,"url":"https://is1-ssl.mzstatic.com/image/thumb/AMCArtistImages211/v4/8a/49/84/8a498443-718e-40c0-404e-d1380c2352b7/ami-identity-531db02daa273271c643ba631a46b9d5-2026-09-07T07-12-12.872Z_cropped.png/{w}x{h}{c}.{f}","width":1050},"cropStyle":"sr"},"bioAction":{"$kind":"flowAction","destination":{"kind":"modalPage","intent":{"$kind":"ArtistBiographyPageIntent","contentDescriptor":{"kind":"artist","identifiers":{"storeAdamID":"657515"},"url":"https://music.apple.com/ca/artist/radiohead/657515"}}}},"bio":"More than a band, Radiohead is a symbol\u2014an avatar for the idea that rock music can be both genuinely popular and genuinely experimental at the same time. Capital-A art, scaled up for the arena. Though not necessarily the first to bridge that gap (Bowie did it; Pink Floyd and The Beatles, too), Radiohead might be the most uncompromising, yanking their listeners into soundworlds so anathema to pop (Krautrock, 20th-century classical, techno, and ambient) that their music almost felt like a dare\u2014or, as one executive at Capitol Records put it during the lead-up to 2000\u2019s <i>Kid A</i>, the job wasn\u2019t to nudge Radiohead toward the centre, but bring the centre toward them. \n\nFormed in 1985 in Oxfordshire, England, the band started playing together while still teenagers (their original name, On a Friday, denoted when they met for practice\u2014a pretty literal move, given what they went on to). Influenced by British post-punk (Joy Division, The Smiths) and early American indie rock (R.E.M., Pixies), their initial sound was lumped in, fairly or otherwise, with grunge, a scene the band was lost in. Hard as it is to believe now, \u201cCreep\u201d\u2014a signature not just for them, but also for \u201990s guitar music in general\u2014didn\u2019t hit until nearly a year after its release, recasting the band as inheritors to the kind of alternative anthem championed by U2. \n\nFrom there, they dug a rabbit hole and dove down, delivering a string of increasingly ambitious albums (starting with 1997\u2019s <i>OK Computer</i>) that pushed the possibilities of a conventional rock-band setup to the brink while still retaining an audience\u2014a balance owed in no small part to singer Thom Yorke, who made politicized alienation feel eerily familiar, almost cozy. \n\nA few decades into their career, they continue to change, from the rhythmic meditations of 2011\u2019s <i>The King of Limbs</i> to the strings-heavy, almost pastoral disquiet of 2016\u2019s <i>A Moon Shaped Pool</i>. As experimental as the band has been when it comes to the actual business of music-making, they\u2019ve been pretty unconventional with its presentation, too: <i>Kid A</i>, for example, was one of the first albums to be promoted through the internet (not to mention that it was delivered entirely without singles), while 2007\u2019s <i>In Rainbows</i> was offered as a pay-what-you-want download\u2014a first for a band of their stature. When <i>OK Computer</i> celebrated its 20th anniversary in 2017, Radiohead reached a status few do: A classic that was still finding ways to press into the unknown.","titleBadge":{"titleLink":{"title":"Upcoming Concerts","segue":{"$kind":"flowAction","destination":{"kind":"catalogPage","intent":{"$kind":"ArtistConcertsPageIntent","contentDescriptor":{"kind":"artist","identifiers":{"storeAdamID":"657515"},"locale":{"storefront":"ca","language":null}}}}},"url":"https://music.apple.com/ca/concerts/artist/657515"},"image":{"type":"asset","name":"concert.tickets.fill"},"accessibilityElementName":"concertsBadge"},"fallbackArtwork":{"dictionary":{"bgColor":"cecdd2","hasP3":false,"height":1400,"textColor1":"0c0a09","textColor2":"171616","textColor3":"333131","textColor4":"3c3b3b","url":"https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/b7/f2/5d/b7f25d91-4320-47c8-146a-6f84d5bc7e78/cover.jpg/{w}x{h}{c}.{f}","width":1400},"cropStyle":"sr"}}]},{"id":"artists_657515_default.marker.shelfgroup.FeaturedContent.TopSongs-ArtistFeaturedCo
